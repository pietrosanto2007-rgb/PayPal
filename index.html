/* Font: PayPal Sans è proprietario. Se ne hai una copia, mettila in /fonts e verrà usata automaticamente. */
@font-face{font-family:"PPSans";font-weight:400;src:local("PayPal Sans"),local("PayPalSans-Regular"),url("fonts/PayPalSans-Regular.woff2") format("woff2")}

@font-face{font-family:"PPSans";font-weight:700;src:local("PayPal Sans Bold"),url("fonts/PayPalSans-Bold.woff2") format("woff2")}

:root{
  --bg:#eef1fb; --card:#fff; --blue:#0070e0; --blue-d:#0057d8; --ink:#000; --gray:#5f6672; --line:#c9ced8;
  --red:#c9172b; --purple:#4620c0; --pad:16px; --tab-h:77px;
  --font:"PPSans","SF Pro Text","Helvetica Neue",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --big:"PPBig","PPSans","SF Pro Display","Avenir Next","Montserrat","Helvetica Neue",-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;font-size:16px;letter-spacing:-.1px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
svg{display:block;flex:none}
#app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 14px) 0 40px;visibility:hidden;transform:translateX(0)}
.screen.tab{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 20px)}
.screen.on{visibility:visible}
.screen.sub{z-index:10;transform:translateX(100%);transition:transform .24s cubic-bezier(.3,.7,.2,1);visibility:visible}
.screen.sub.on{transform:translateX(0)}
.screen::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad)}
.cb{width:39px;height:39px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--blue);position:relative;transition:transform .12s}
.cb:active{transform:scale(.92)}
.dot{position:absolute;top:0;right:-1px;width:12px;height:12px;border-radius:50%;background:#d93a0b}
.hr{display:flex;gap:8px}
h1{font-family:var(--big);font-weight:800;font-size:33px;letter-spacing:-.6px;line-height:1.15;margin:18px var(--pad) 18px}
.nav{display:flex;align-items:center;padding:6px 18px 12px;height:48px;position:relative}
.nav b{position:absolute;left:0;right:0;text-align:center;font-weight:500;font-size:17px;pointer-events:none}
.nav button{position:relative;z-index:1}

/* search */
.srow{display:flex;gap:12px;align-items:center;margin:0 var(--pad)}
.search{flex:1;height:46px;border:1.500px solid var(--line);border-radius:23px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--gray);font-size:17px;background:#fff0;white-space:nowrap;overflow:hidden}
.chips{display:flex;gap:6px;overflow-x:auto;padding:16px var(--pad) 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:15px;background:#fff;font-size:14px;font-weight:500;display:grid;place-items:center;white-space:nowrap}
.chip.on{background:#000;color:#fff}

/* cards */
.card{background:var(--card);border-radius:16px;margin:0 var(--pad);overflow:hidden}
.sq{border-radius:0}
.h2{font-size:17px;font-weight:500;margin:22px var(--pad) 10px}
.h2.big{font-size:19px}
.sub-h{font-size:14px;color:var(--gray);margin:0 var(--pad) 10px}
.link{color:var(--blue);text-decoration:underline;font-size:15px}

/* home */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px var(--pad) 0;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.bal{flex:0 0 calc(100% - 42px);scroll-snap-align:start;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.bal .top{padding:14px 16px 16px;min-height:118px}
.bal .l{display:flex;align-items:center;gap:8px;font-size:14px}
.bal .a{font-family:var(--big);font-weight:800;font-size:34px;color:var(--red);letter-spacing:-1px;margin-top:18px}
.addb{display:flex;align-items:center;gap:12px;background:var(--blue-d);color:#fff;padding:16px;width:100%;transition:filter .15s}
.addb:active{filter:brightness(.92)}
.addb .ic{width:46px;height:46px;border-radius:9px;background:var(--blue);display:grid;place-items:center}
.addb .t{flex:1;font-size:14px}.addb .t b{display:block;font-size:17px;font-weight:700;margin-bottom:2px}
.col{flex:0 0 calc(100% - 42px);scroll-snap-align:start;background:var(--blue);color:#fff;border-radius:16px;padding:14px 16px;position:relative;min-height:218px}
.col small{font-size:14px;display:block}.col b{display:block;font-family:var(--big);font-weight:700;font-size:19px;line-height:1.2;margin-top:6px;width:80%}
.avs{position:absolute;left:14px;bottom:14px;display:flex}
.avs i{width:36px;height:36px;border-radius:50%;border:2px solid #fff;margin-right:-4px;background:linear-gradient(135deg,#d9b8a6,#5b3a2e)}
.avs i+i{background:linear-gradient(135deg,#e6c9d9,#7b3f62)}
.feat{background:#e0f4fd;border-radius:16px;margin:0 var(--pad);padding:16px;position:relative;min-height:190px}
.feat h3{font-family:var(--big);font-weight:800;font-size:27px;line-height:1.12;letter-spacing:-.5px;width:68%}
.feat p{position:absolute;left:16px;bottom:16px;width:56%;font-size:16px;line-height:1.25}
.feat .go{position:absolute;right:16px;bottom:16px;height:33px;padding:0 15px;border-radius:17px;background:#000;color:#fff;font-weight:700;font-size:14px}
.fc{position:absolute;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 12px rgba(0,30,80,.18)}
.row2{display:flex;justify-content:space-between;align-items:baseline;margin:26px var(--pad) 10px}
.row2 b{font-weight:500;font-size:19px}.row2 span{color:var(--gray);font-size:14px;display:flex;align-items:center;gap:6px}

/* transactions */
.tx{display:flex;align-items:flex-start;width:100%;padding:14px 16px 12px;min-height:72px;gap:12px;transition:background .15s}
.tx:active{background:#f1f3f9}
.tx .lg{width:48px;flex:none;display:block;margin-top:2px}
.tx .tt{flex:1;min-width:0;font-size:15.5px;color:var(--gray);line-height:1.3}
.tx .tt b{display:block;color:#000;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .am{font-weight:500;font-size:16px;margin-top:0}
.pkg{display:flex;align-items:center;gap:12px;padding:15px;margin:22px var(--pad) 0;background:#fff;border-radius:16px;width:calc(100% - 32px);font-weight:500;font-size:16.500px}
.pkg .ci{width:31px;height:31px;border-radius:50%;background:var(--blue);display:grid;place-items:center}

/* send */
.ban{margin:0 var(--pad) 14px;background:var(--purple);color:#fff;border-radius:16px;padding:14px 14px;display:flex;gap:10px;font-size:16.500px;line-height:1.3;transition:opacity .2s,transform .2s}
.ban.x{opacity:0;transform:scale(.97)}
.kb{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}
.pr{display:flex;align-items:center;gap:14px;padding:11px 16px;width:100%;min-height:62px}
.pr .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none;overflow:hidden}
.pr .n{flex:1;min-width:0;font-weight:500;font-size:16.500px;line-height:1.3}.pr .n small{display:block;color:var(--gray);font-weight:400;font-size:15px}

/* detail */
.pc{padding:16px;display:flex;gap:14px;margin:0 var(--pad)}
.pc h4{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.5px}
.pc .m{flex:1}.pc .am{font-weight:500;font-size:16px;white-space:nowrap}
.tx2{padding:16px;font-size:17px;line-height:1.3;letter-spacing:-.4px}
.help{display:flex;align-items:center;gap:14px;padding:22px 16px 28px;width:100%;font-size:17px}

/* menu */
.mh{font-size:20px;font-weight:500;margin:20px 16px 10px}
.mi{display:flex;align-items:center;width:100%;height:46.5px;padding:0 22px;gap:20px;font-size:17px;transition:background .15s}
.mi:active{background:#f1f3f9}
.mi svg{width:30px;height:30px}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;background:#fff;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));display:flex;padding-top:6px;transition:transform .24s}
.tabbar.h{transform:translateY(100%)}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--gray);padding-top:2px}
.tb.on{color:#000;font-weight:700}
</style>
</head>

const TABS=[['home','home','Pagina principale'],['acc','wallet','Conti'],['send','ud','Invia e richiedi'],['hist','doc','Cronologia']];

/* ============ NAVIGAZIONE ============ */
const app=document.getElementById('app');
app.innerHTML=Object.values(SCREENS).join('')+`<nav class="tabbar" id="tb">${TABS.map(t=>`<button class="tb" data-tab="${t[0]}">${ic(t[1],30,1.5)}<span>${t[2]}</span></button>`).join('')}</nav>`;
const $=id=>document.getElementById(id);
let cur='home',stack=[];
function tab(id){
  cur=id;stack=[];
  document.querySelectorAll('.screen.tab').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('.screen.sub').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));
  $('tb').classList.remove('h');$(id).scrollTop=0;
}
function push(id,i){
  if(id==='pay'){const t=DEMO.tx[i||0];
    $('pn').textContent=t.f;$('pd').textContent=t.t;$('pa').textContent=t.a.replace('-','−');$('po').textContent=t.f.replace('...','').replace('A.T.M.','A.T.M.');
    $('plg').innerHTML=LOGO[t.l];$(id).scrollTop=0;}
  stack.push(id);$(id).classList.add('on');$('tb').classList.add('h');
}
function back(){const id=stack.pop();if(id)$(id).classList.remove('on');if(!stack.length)$('tb').classList.remove('h');}
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-back],#banx');if(!t)return;
  if(t.id==='banx')return $('ban').classList.add('x'),setTimeout(()=>$('ban').remove(),200);
  if(t.dataset.tab)tab(t.dataset.tab);
  else if(t.dataset.go)push(t.dataset.go,+t.dataset.i);
  else back();
});
tab('home');
</script>
